version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "develop"
    # TypeScript 7 (Go-Port) bricht typescript-eslint ab ("does not support
    # TS 7.0", siehe #515). Erst freigeben, wenn typescript-eslint TS >=7.1
    # unterstützt: https://github.com/typescript-eslint/typescript-eslint/issues/10940
    ignore:
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
    # Ohne Gruppierung macht Dependabot einen PR pro Package. Minor/Patch sind
    # in aller Regel gefahrlos und laufen gebündelt in einem PR; Major-Bumps
    # brechen öfter (siehe #192: typescript 5→7 hat typescript-eslint zerlegt)
    # und bleiben deshalb in einer eigenen Gruppe, damit sie nicht die
    # unschuldigen Updates mit runterreißen.
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
      npm-major:
        update-types:
          - "major"
  # Actions sind ebenfalls Supply Chain — eine gepinnte Action-Version kann
  # ein Sicherheitsupdate genauso brauchen wie eine npm-Dependency.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "develop"
    groups:
      github-actions:
        patterns:
          - "*"
