name: Docker build

on:
  push:
    branches: [feature/autodeploy-workflows, develop, preview, release, main]
    tags: ["v*", "[0-9]+.[0-9]+*"]
  workflow_dispatch:

# Ein laufender Build pro Ref reicht — verhindert auch, dass ein älterer Lauf
# einen neueren Branch-/latest-Tag überschreibt.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and push app image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for version git tag
        id: version
        run: |
          TAG=$(git tag --points-at HEAD | grep -E '^v?[0-9]+\.[0-9]+' | sort -V | tail -n 1 || true)
          if [ -z "$TAG" ] && git rev-parse --verify HEAD^2 >/dev/null 2>&1; then
            TAG=$(git tag --points-at HEAD^2 | grep -E '^v?[0-9]+\.[0-9]+' | sort -V | tail -n 1 || true)
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "clean=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref_name == 'release' }}
            type=raw,value=preview,enable=${{ github.ref_name == 'preview' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ steps.version.outputs.tag }},enable=${{ steps.version.outputs.tag != '' }}
            type=raw,value=${{ steps.version.outputs.clean }},enable=${{ steps.version.outputs.clean != '' }}
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
