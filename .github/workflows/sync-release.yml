name: Sync release → develop

# Nach jedem Release-Merge enthält `release` einen Merge-Commit, den `develop`
# nicht kennt → der nächste Release-PR ist "out-of-date". Dieser Workflow
# öffnet automatisch einen PR, der `release` zurück nach `develop` führt.
# Mergen (regulärer Merge-Commit, kein Squash) bleibt manuell.

on:
  push:
    branches: [release]

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # PAT nötig, damit der Check "verify" auf dem Sync-PR anläuft:
          # Pushes mit GITHUB_TOKEN lösen keine Workflows aus.
          token: ${{ secrets.SYNC_PR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Sync-Branch erzeugen und PR öffnen
        env:
          GH_TOKEN: ${{ secrets.SYNC_PR_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin develop release
          if git merge-base --is-ancestor origin/release origin/develop; then
            echo "develop enthält release bereits — nichts zu tun."
            exit 0
          fi
          if [ -n "$(gh pr list --base develop --head sync/release-into-develop --state open --json number --jq '.[]')" ]; then
            echo "Sync-PR ist bereits offen."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c sync/release-into-develop origin/develop
          git merge origin/release --no-edit
          git push --force origin sync/release-into-develop
          gh pr create --base develop --head sync/release-into-develop \
            --title "chore: release in develop zurückführen" \
            --body "Automatisch: führt die Merge-Commits aus \`release\` zurück nach \`develop\`, damit der nächste Release-PR nicht out-of-date ist. Regulärer Merge-Commit, kein Squash."
