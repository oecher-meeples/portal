name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

# Ein laufender Check pro Branch reicht — ältere Läufe abbrechen.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma Client generieren
        run: pnpm prisma generate

      # Formatierung zuerst — der billigste Check.
      - name: Formatierung
        run: pnpm run format:check

      # Typen.
      - name: Typecheck
        run: pnpm run typecheck

      # Enthält die Architekturregeln: Schichten-Import-Richtung,
      # Feature-Isolation und max. 400 Zeilen pro Datei.
      - name: Lint & Architekturregeln
        run: pnpm run lint

      # Ersetzt einen separaten `test`-Schritt statt daneben zu laufen — die
      # Suite zweimal auszuführen wäre reine Verschwendung. Schwelle in
      # vitest.config.ts, abgeleitet aus der gemessenen Baseline (#38).
      - name: Tests mit Coverage-Schwelle
        run: pnpm run test:coverage

      # Blockierend. Die Allowlist bewusst offener Funde (better-auth-Kette,
      # Issue #10; brace-expansion, nur Dev-Tooling) steht in
      # pnpm-workspace.yaml (auditConfig.ignoreGhsas) statt hier als Flags —
      # eine Quelle der Wahrheit für lokale Läufe und CI gleichermaßen.
      - name: Dependency-Vulnerability-Scan
        run: pnpm audit --audit-level high

      # Nur Information: macht neue Duplikate sichtbar, bricht den Build nicht.
      - name: Duplikate (DRY-Hinweis, nicht blockierend)
        run: pnpm run dup
        continue-on-error: true

      - name: Next-Build-Cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: next-build-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'prisma/**') }}
          restore-keys: |
            next-build-${{ hashFiles('pnpm-lock.yaml') }}-

      # Läuft nie gegen eine echte Datenbank — next build fasst keine Verbindung
      # an, alle Routen sind dynamisch (ƒ). Die Werte müssen nur das Format
      # erfüllen, das requireEnv()/better-auth beim Modul-Import prüfen.
      - name: Build
        run: pnpm run build
        env:
          DATABASE_URL: "postgresql://user:pass@localhost:5432/db"
          NEON_AUTH_BASE_URL: "https://example.neonauth.example/auth"
          NEON_AUTH_COOKIE_SECRET: "ci-build-dummy-secret-32-characters-min"
          MEMBER_DATA_ENCRYPTION_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          CRON_SECRET: "ci-build-dummy-cron-secret"
          PUBLIC_SITE_URL: "https://example.org"
