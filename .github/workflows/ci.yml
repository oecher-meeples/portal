name: CI

# Läuft nur auf PRs und in der Merge Queue (merge_group). Kein `push`-Trigger:
# develop wird ausschließlich über die Queue befüllt, deren Merge-Ergebnis hier
# schon geprüft wurde.
on:
  pull_request:
  merge_group:

# Ein laufender Check pro Branch reicht — ältere Läufe abbrechen.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Der Pflicht-Check `verify` muss immer melden (ein Workflow-`paths-ignore`
      # ließe ihn "pending" und den PR unmergebar). Deshalb läuft der Job immer
      # und überspringt die teuren Schritte, wenn nur Doku/CI/Pläne geändert sind.
      - name: Änderungen klassifizieren
        id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          if git diff --name-only "$BASE" "$HEAD" | grep -qvE '^(\.claude/|docs/|\.github/|\.husky/)|\.md$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Nur Doku/CI/Pläne geändert - Typecheck, Lint, Tests und Build entfallen."
          fi

      - uses: pnpm/action-setup@v6.1.1

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma Client generieren
        run: pnpm prisma generate

      # Formatierung zuerst — der billigste Check.
      - name: Formatierung
        run: pnpm run format:check

      # Typen.
      - name: Typecheck
        if: steps.changes.outputs.code == 'true'
        run: pnpm run typecheck

      # Enthält die Architekturregeln: Schichten-Import-Richtung,
      # Feature-Isolation und max. 400 Zeilen pro Datei.
      - name: Lint & Architekturregeln
        if: steps.changes.outputs.code == 'true'
        run: pnpm run lint

      # Ersetzt einen separaten `test`-Schritt statt daneben zu laufen — die
      # Suite zweimal auszuführen wäre reine Verschwendung. Schwelle in
      # vitest.config.ts, abgeleitet aus der gemessenen Baseline (#38).
      - name: Tests mit Coverage-Schwelle
        if: steps.changes.outputs.code == 'true'
        run: pnpm run test:coverage

      - name: Next-Build-Cache
        if: steps.changes.outputs.code == 'true'
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: next-build-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'prisma/**') }}
          restore-keys: |
            next-build-${{ hashFiles('pnpm-lock.yaml') }}-

      # Läuft nie gegen eine echte Datenbank — next build fasst keine Verbindung
      # an, alle Routen sind dynamisch (ƒ). Die Werte müssen nur das Format
      # erfüllen, das requireEnv()/better-auth beim Modul-Import prüfen.
      - name: Build
        if: steps.changes.outputs.code == 'true'
        run: pnpm run build
        env:
          DATABASE_URL: "postgresql://user:pass@localhost:5432/db"
          BETTER_AUTH_URL: "http://localhost:3000"
          BETTER_AUTH_SECRET: "ci-build-dummy-secret-32-characters-min"
          MEMBER_DATA_ENCRYPTION_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          CRON_SECRET: "ci-build-dummy-cron-secret"
          PUBLIC_SITE_URL: "https://example.org"
