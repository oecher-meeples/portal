overrides:
  sharp: ">=0.35.0"
  postcss: ">=8.5.18"
  "@hono/node-server@<2.0.5": ^2.0.5
  better-auth@<1.6.2: ^1.6.2
  better-auth@>=0.3.4 <1.6.11: ^1.6.11
  brace-expansion@<1.1.20: ^1.1.20
  brace-expansion@>=4.0.0 <5.0.11: ^5.0.11
  fast-uri: ^3.1.7
  nanoid@<3.3.18: ^3.3.18
  # GHSA-2883-xcg3-v3hh: js-yaml maxTotalMergeKeys CPU-DoS, transitiv über
  # gray-matter (3.x) und eslint-Kette (4.x).
  js-yaml@3: ^3.15.2
  js-yaml@4: ^4.3.2
  # GHSA-rfgv-xxqx-mfg5 / GHSA-w293-vg96-wgc3 / GHSA-vp8m-p9jh-q5pm: undici
  # DoS/TLS-Bypass/Cache-Poisoning, transitiv über @vercel/blob (6.x), shadcn
  # (7.x) und jsdom/better-auth/vitest (8.x).
  undici@6: ^6.28.1
  undici@7: ^7.29.1
  undici@8: ^8.10.2
  # GHSA-ggr8-5vv4-36mx: deepmerge-ts stack exhaustion, gepinnt auf 7.1.5 in
  # @prisma/config@7.9.1 (kein stabiler Prisma-Release mit der Fix-Version
  # verfügbar). @prisma/config nutzt nur die einfache deepmerge()-Funktion,
  # keine der Breaking Changes in 8.0.0 (deepmergeInto-Mutationsverhalten,
  # umbenannte Typen) betrifft diesen Aufruf — Override ist sicher.
  deepmerge-ts: ">=8.0.0"
onlyBuiltDependencies:
  - sharp
  - unrs-resolver
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  core-js: true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
# Bewusst offene Funde, kein generell akzeptiertes Risiko:
#   - better-auth-Kette (8 Advisories, davon GHSA-pw9m-5jxm-xr6h critical) hängt an
#     Issue #10 (Neon-Auth-/better-auth-Upgrade-Klärung).
# Jede neue Advisory außerhalb dieser Liste lässt `pnpm audit` in der CI fehlschlagen.
auditConfig:
  ignoreGhsas:
    - GHSA-9h47-pqcx-hjr4
    - GHSA-86j7-9j95-vpqj
    - GHSA-7w99-5wm4-3g79
    - GHSA-392p-2q2v-4372
    - GHSA-g38m-r43w-p2q7
    - GHSA-fmh4-wcc4-5jm3
    - GHSA-pw9m-5jxm-xr6h
    - GHSA-qq9h-g4jm-xgf3
    # mysql2 (better-auth → prisma → mysql2, transitiv) — Projekt nutzt
    # ausschließlich Postgres/Neon, mysql2 wird nie tatsächlich verwendet.
    - GHSA-3f6p-5ww8-9rcr
    # braces Stack-Exhaustion-DoS (transitiv über eslint-config-next/shadcn →
    # fast-glob → micromatch → braces) — kein Fix verfügbar, npm führt
    # aktuell nur bis 3.0.3 (Stand 2026-10-03), die von der Advisory
    # geforderte 3.0.4 existiert noch nicht. Erneut prüfen, sobald ein
    # Patch-Release erscheint.
    - GHSA-vfj7-8cjw-p6xm
minimumReleaseAgeExclude:
  - better-auth@1.6.2 || 1.6.11
  - "@hono/node-server@2.0.5"
  - hono@4.12.34
  - js-yaml@3.15.2 || 4.3.2
  - brace-expansion@1.1.20 || 5.0.11
  - fast-uri@3.1.7
  - nanoid@3.3.18
  - next@16.3.8
  - undici@6.28.1 || 7.29.1 || 8.10.2
