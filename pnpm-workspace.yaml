overrides:
  sharp: ">=0.35.0"
  postcss: ">=8.5.18"
onlyBuiltDependencies:
  - sharp
  - unrs-resolver
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  core-js: true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
# Bewusst offene Funde, kein generell akzeptiertes Risiko:
#   - better-auth-Kette (8 Advisories, davon GHSA-pw9m-5jxm-xr6h critical) und die
#     transitiv über @neondatabase/auth->...->ajv gezogene fast-uri hängen an
#     Issue #10 (Neon-Auth-/better-auth-Upgrade-Klärung).
#   - brace-expansion (2 Advisories) nur über eslint/@typescript-eslint im
#     Dev-Tooling, nicht im Production-Bundle.
# Jede neue Advisory außerhalb dieser Liste lässt `pnpm audit` in der CI fehlschlagen.
auditConfig:
  ignoreGhsas:
    - GHSA-9h47-pqcx-hjr4
    - GHSA-86j7-9j95-vpqj
