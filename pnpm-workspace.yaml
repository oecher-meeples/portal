overrides:
  sharp: ">=0.35.0"
  postcss: ">=8.5.18"
  "@hono/node-server@<2.0.5": ^2.0.5
  better-auth@<1.6.2: ^1.6.2
  better-auth@>=0.3.4 <1.6.11: ^1.6.11
  brace-expansion@<1.1.17: ^1.1.18
  brace-expansion@>=4.0.0 <5.0.9: ^5.0.9
  fast-uri: ^3.1.5
  nanoid@<3.3.18: ^3.3.18
onlyBuiltDependencies:
  - sharp
  - unrs-resolver
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  core-js: true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
# Bewusst offene Funde, kein generell akzeptiertes Risiko:
#   - better-auth-Kette (8 Advisories, davon GHSA-pw9m-5jxm-xr6h critical) hängt an
#     Issue #10 (Neon-Auth-/better-auth-Upgrade-Klärung).
# Jede neue Advisory außerhalb dieser Liste lässt `pnpm audit` in der CI fehlschlagen.
auditConfig:
  ignoreGhsas:
    - GHSA-9h47-pqcx-hjr4
    - GHSA-86j7-9j95-vpqj
    - GHSA-7w99-5wm4-3g79
    - GHSA-392p-2q2v-4372
    - GHSA-g38m-r43w-p2q7
    - GHSA-fmh4-wcc4-5jm3
    - GHSA-pw9m-5jxm-xr6h
    - GHSA-qq9h-g4jm-xgf3
minimumReleaseAgeExclude:
  - better-auth@1.6.2 || 1.6.11
  - "@hono/node-server@2.0.5"
  - hono@4.12.34
  - js-yaml@3.15.1 || 4.3.1
  - brace-expansion@1.1.18 || 5.0.9
  - fast-uri@3.1.5
  - nanoid@3.3.18
