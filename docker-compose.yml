# Self-hosting stack (see docs/deployment-docker.md and
# .claude/plans/docker-self-hosted-migration.md).
#
#   cp .env.dist .env                # fill in, then:
#   docker compose up -d --build
#
# Services: app, postgres, seaweedfs and seaweedfs-init (one-shot).
# All services bind to 127.0.0.1 only — a reverse proxy on the host points at
# 127.0.0.1:3000 (app) and 127.0.0.1:8333 (blob storage, S3_PUBLIC_ENDPOINT).
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      # Entrypoint runs `prisma migrate deploy` + seed on every start — wait
      # for a ready DB and a configured bucket/app access key.
      postgres:
        condition: service_healthy
      seaweedfs-init:
        condition: service_completed_successfully
    ports:
      # Localhost only: a reverse proxy on the host is what faces the internet.
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    # Same check as the Dockerfile's HEALTHCHECK, restated so `docker compose
    # ps` shows it.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file: .env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      # Bound to localhost only, so `prisma migrate` / pg_restore from the
      # host work without exposing the database to the network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # S3-compatible blob storage (uploads, generated images) — replaces Vercel
  # Blob. The app reaches it via S3_ENDPOINT, browsers via S3_PUBLIC_ENDPOINT.
  # Originally MinIO; switched to SeaweedFS (Apache-2.0) after MinIO deleted
  # its Docker Hub images in Sept. 2026 and archived the OSS project. Image
  # pinned to a tested version — check for updates before bumping.
  seaweedfs:
    build: ./docker/seaweedfs
    restart: unless-stopped
    env_file: .env
    volumes:
      - seaweedfs-data:/data
    ports:
      # Localhost only, like postgres; the public endpoint (images, uploads)
      # is exposed through the reverse proxy on the host.
      - "127.0.0.1:${S3_API_PORT:-8333}:8333"
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # One-shot bucket setup, idempotent on every `docker compose up`: creates
  # the bucket and makes it anonymously readable (stored blob URLs are
  # public, like on Vercel Blob) via a standard S3 bucket policy — SeaweedFS
  # has no root/admin-console user, so this uses the "admin" identity from
  # seaweedfs's s3-config.json instead of a separate control-plane API.
  seaweedfs-init:
    image: amazon/aws-cli:2.33.0
    env_file: .env
    depends_on:
      seaweedfs:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        export AWS_ACCESS_KEY_ID="$${AWS_ACCESS_KEY_ID:-$$SEAWEEDFS_ADMIN_ACCESS_KEY}"
        export AWS_SECRET_ACCESS_KEY="$${AWS_SECRET_ACCESS_KEY:-$$SEAWEEDFS_ADMIN_SECRET_KEY}"
        export AWS_DEFAULT_REGION="$${AWS_DEFAULT_REGION:-$${S3_REGION:-us-east-1}}"
        ENDPOINT="http://seaweedfs:8333"
        # Idempotent on every `docker compose up`: head-bucket first so a
        # bucket that already exists (every run after the first) doesn't
        # print aws-cli's (harmless) BucketAlreadyOwnedByYou error.
        aws --endpoint-url "$$ENDPOINT" s3api head-bucket --bucket "$$S3_BUCKET" 2>/dev/null \
          || aws --endpoint-url "$$ENDPOINT" s3 mb "s3://$$S3_BUCKET"
        cat > /tmp/policy.json <<JSON
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": "*",
              "Action": "s3:GetObject",
              "Resource": "arn:aws:s3:::$$S3_BUCKET/*"
            }
          ]
        }
        JSON
        aws --endpoint-url "$$ENDPOINT" s3api put-bucket-policy --bucket "$$S3_BUCKET" --policy file:///tmp/policy.json
    restart: "no"

volumes:
  postgres-data:
  seaweedfs-data:
